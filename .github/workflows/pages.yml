name: Pubblica Blood Master
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepara Godot 4.7
        run: |
          curl -fLsS https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          curl -fLsS https://github.com/godotengine/godot/releases/download/4.7-stable/Godot_v4.7-stable_export_templates.tpz -o /tmp/templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/4.7.stable
          unzip -q -j /tmp/templates.tpz templates/web_nothreads_release.zip -d ~/.local/share/godot/export_templates/4.7.stable
      - name: Verifica ed esporta
        run: |
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --editor --import --quit
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --script tests/rules_test.gd
          mkdir -p build/web
          /tmp/godot-bin/Godot_v4.7-stable_linux.x86_64 --headless --path . --export-release Web build/web/index.html
          test -s build/web/index.pck
          touch build/web/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
